<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="1000" height="700" rx="24" fill="#edf5fb"/><text x="65" y="80" font-family="Arial,sans-serif" font-size="19" letter-spacing="3" fill="#17657c">NOG TE ONDERZOEKEN</text><text x="65" y="140" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#142d40">Vragen voor een volgende toets</text><rect x="65" y="195" width="870" height="96" rx="16" fill="#f9fcff" stroke="#bdd3e2"/><circle cx="112" cy="243" r="22" fill="#d6e8f3"/><text x="105" y="251" font-family="Arial,sans-serif" font-size="22" fill="#17657c">1</text><text x="155" y="252" font-family="Arial,sans-serif" font-size="27" fill="#142d40">Begrijpt de bewoner de route?</text><rect x="65" y="320" width="870" height="96" rx="16" fill="#f9fcff" stroke="#bdd3e2"/><circle cx="112" cy="368" r="22" fill="#d6e8f3"/><text x="105" y="376" font-family="Arial,sans-serif" font-size="22" fill="#17657c">2</text><text x="155" y="377" font-family="Arial,sans-serif" font-size="27" fill="#142d40">Welke uitleg ontbreekt?</text><rect x="65" y="445" width="870" height="96" rx="16" fill="#f9fcff" stroke="#bdd3e2"/><circle cx="112" cy="493" r="22" fill="#d6e8f3"/><text x="105" y="501" font-family="Arial,sans-serif" font-size="22" fill="#17657c">3</text><text x="155" y="502" font-family="Arial,sans-serif" font-size="27" fill="#142d40">Wie mag informatie wijzigen?</text><text x="65" y="630" font-family="Arial,sans-serif" font-size="20" fill="#475e70">Nog te onderzoeken met bewoners en begeleiders.</text></svg>